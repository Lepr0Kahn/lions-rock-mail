<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lions Rock Studio — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0c0c;--panel:#171616;--border:rgba(255,255,255,.1);--text:#f4f1ea;--muted:#9c9893;--accent:#c24d2c;--green:#44b66b;--amber:#dca34b;--red:#ef6a61}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
body{padding:18px}.wrap{max-width:1260px;margin:0 auto}.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.title{font-family:Georgia,serif;font-size:30px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}.stat{background:var(--panel);border:1px solid var(--border);padding:14px}.stat .k{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}.stat .v{font-size:24px;font-weight:800;margin-top:4px}.tabs{display:flex;gap:6px;margin-bottom:12px;overflow:auto}.tab,.btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 11px;font:inherit;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.tab.active,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.green{border-color:rgba(68,182,107,.5);color:#9ce5b1}.btn.amber{border-color:rgba(220,163,75,.5);color:#ffd697}.btn.red{border-color:rgba(239,106,97,.5);color:#ff9d96}.btn:disabled{opacity:.5;cursor:wait}
.panel{background:var(--panel);border:1px solid var(--border)}.row{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(180px,.9fr) minmax(160px,.7fr) minmax(290px,1.2fr);gap:12px;padding:14px;border-bottom:1px solid rgba(255,255,255,.06);align-items:center}.row:last-child{border-bottom:0}.name{font-weight:800;font-size:14px}.meta{font-size:11px;color:var(--muted);line-height:1.5;margin-top:3px}.tag{display:inline-block;padding:3px 7px;border:1px solid var(--border);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-right:4px}.tag.paid,.tag.active{color:#9ce5b1;border-color:rgba(68,182,107,.45)}.tag.pending,.tag.awaiting_payment{color:#ffd697;border-color:rgba(220,163,75,.45)}.tag.declined,.tag.suspended{color:#ff9d96;border-color:rgba(239,106,97,.45)}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.empty{padding:40px;text-align:center;color:var(--muted)}.note{font-size:11px;color:var(--muted);background:#111;border:1px solid var(--border);padding:10px;margin:12px 0}.loader{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.actions{justify-content:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1 class="title">Access Administration</h1><div class="sub">Review applications, confirm payment, activate invitations, and manage member access.</div></div>
    <button class="btn" id="refresh">Refresh</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="k">Pending</div><div class="v" id="s-pending">—</div></div>
    <div class="stat"><div class="k">Awaiting Payment</div><div class="v" id="s-payment">—</div></div>
    <div class="stat"><div class="k">Active Members</div><div class="v" id="s-active">—</div></div>
    <div class="stat"><div class="k">Suspended</div><div class="v" id="s-suspended">—</div></div>
  </div>
  <div class="note">Workflow: <b>Approve → Confirm payment → Activate & Invite.</b> No applicant can access Studio until you complete all three steps.</div>
  <div class="tabs">
    <button class="tab active" data-view="applications">Applications</button>
    <button class="tab" data-view="members">Members</button>
  </div>
  <div class="panel" id="content"><div class="loader">Loading…</div></div>
</div>
<script>
(function(){
 const URL="https://xsvczfqvscnvmngwcmtp.supabase.co";
 const KEY="sb_publishable_ZQGFWpZzlDsWBRclrySAyg_CYWqvU40";
 const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 const content=document.getElementById("content");
 let session=null,apps=[],members=[],view="applications";
 function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
 function dt(s){if(!s)return"—";try{return new Date(s).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});}catch(_){return s}}
 function tag(s){return '<span class="tag '+esc(s)+'">'+esc(String(s||"").replace(/_/g," "))+'</span>'}
 function msg(s,bad){const el=document.createElement("div");el.style.cssText="position:fixed;right:16px;bottom:16px;z-index:50;background:#1b1a1a;border:1px solid "+(bad?"#7b302c":"rgba(255,255,255,.12)")+";padding:12px 14px;max-width:360px;font-size:12px";el.textContent=s;document.body.appendChild(el);setTimeout(()=>el.remove(),3600)}
 async function requireOwner(){
   const s=await sb.auth.getSession();session=s.data&&s.data.session;
   if(!session){content.innerHTML='<div class="empty">Sign in to Lions Rock Studio first.</div>';return false}
   const r=await sb.from("app_memberships").select("role,access_status").eq("user_id",session.user.id).maybeSingle();
   if(r.error||r.data?.role!=="owner"||r.data?.access_status!=="active"){content.innerHTML='<div class="empty">Owner access required.</div>';return false}
   return true;
 }
 async function load(){
   if(!await requireOwner())return;
   const [a,m]=await Promise.all([
     sb.from("studio_applications").select("*").order("submitted_at",{ascending:false}),
     sb.from("app_memberships").select("*").order("created_at",{ascending:false})
   ]);
   if(a.error||m.error){content.innerHTML='<div class="empty">Could not load administration data.</div>';return}
   apps=a.data||[];members=(m.data||[]).filter(x=>x.role!=="owner");
   document.getElementById("s-pending").textContent=apps.filter(x=>x.status==="pending").length;
   document.getElementById("s-payment").textContent=apps.filter(x=>["approved","awaiting_payment","paid"].includes(x.status)&&x.payment_status==="unpaid").length;
   document.getElementById("s-active").textContent=members.filter(x=>x.access_status==="active").length;
   document.getElementById("s-suspended").textContent=members.filter(x=>x.access_status==="suspended").length;
   render();
 }
 function render(){
   document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.view===view));
   view==="members"?renderMembers():renderApps();
 }
 function renderApps(){
   if(!apps.length){content.innerHTML='<div class="empty">No applications yet.</div>';return}
   content.innerHTML=apps.map(a=>{
     const contact=[a.email,a.phone].filter(Boolean).join(" · ");
     let actions='';
     if(a.status==="pending")actions+='<button class="btn amber" data-act="approve" data-id="'+a.id+'">Approve</button><button class="btn red" data-act="decline" data-id="'+a.id+'">Decline</button>';
     if(["approved","awaiting_payment"].includes(a.status)&&a.payment_status==="unpaid")actions+='<button class="btn green" data-act="paid" data-id="'+a.id+'">Mark Paid</button><button class="btn" data-act="comp" data-id="'+a.id+'">Comp Access</button>';
     if(["paid","approved","awaiting_payment"].includes(a.status)&&["paid","comped"].includes(a.payment_status))actions+='<button class="btn primary" data-act="activate" data-id="'+a.id+'">Activate & Invite</button>';
     if(a.status==="active")actions+='<span class="tag active">Invitation sent</span>';
     return '<div class="row"><div><div class="name">'+esc(a.full_name)+'</div><div class="meta">'+esc(a.business_name)+'<br>'+esc(contact)+(a.website?'<br>'+esc(a.website):'')+'</div></div><div>'+tag(a.status)+' '+tag(a.payment_status)+'<div class="meta">Applied '+esc(dt(a.submitted_at))+'</div></div><div class="meta">'+(a.about?esc(a.about):'No application note.')+'</div><div class="actions">'+actions+'</div></div>';
   }).join("");
   wireActions();
 }
 function renderMembers(){
   if(!members.length){content.innerHTML='<div class="empty">No paid members yet.</div>';return}
   content.innerHTML=members.map(m=>{
     const action=m.access_status==="active"?'<button class="btn red" data-member-act="suspend" data-id="'+m.id+'">Suspend</button>':'<button class="btn green" data-member-act="reactivate" data-id="'+m.id+'">Reactivate</button>';
     return '<div class="row"><div><div class="name">'+esc(m.business_name||m.email)+'</div><div class="meta">'+esc(m.email)+'</div></div><div>'+tag(m.access_status)+' '+tag(m.payment_status)+'</div><div class="meta">Plan: '+esc(m.plan)+'<br>Activated '+esc(dt(m.activated_at))+'</div><div class="actions">'+action+'</div></div>';
   }).join("");
   content.querySelectorAll("[data-member-act]").forEach(b=>b.onclick=()=>memberAction(b.dataset.memberAct,b.dataset.id,b));
 }
 function wireActions(){
   content.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>appAction(b.dataset.act,b.dataset.id,b));
 }
 async function appAction(act,id,button){
   button.disabled=true;
   try{
     const now=new Date().toISOString();
     let q=null;
     if(act==="approve")q=sb.from("studio_applications").update({status:"awaiting_payment",approved_at:now}).eq("id",id);
     if(act==="decline")q=sb.from("studio_applications").update({status:"declined"}).eq("id",id);
     if(act==="paid")q=sb.from("studio_applications").update({status:"paid",payment_status:"paid",paid_at:now}).eq("id",id);
     if(act==="comp")q=sb.from("studio_applications").update({status:"paid",payment_status:"comped",paid_at:now}).eq("id",id);
     if(q){const r=await q;if(r.error)throw r.error;msg(act==="approve"?"Approved — now awaiting payment.":act==="paid"?"Payment confirmed.":act==="comp"?"Access comped.":"Application declined.");}
     if(act==="activate"){
       const r=await sb.functions.invoke("studio-activate-member",{body:{application_id:id}});
       if(r.error)throw r.error;
       if(r.data&&r.data.error)throw new Error(r.data.error);
       msg("Member activated and invitation email sent.");
     }
     await load();
   }catch(e){msg(e.message||String(e),true)}
   finally{button.disabled=false}
 }
 async function memberAction(act,id,button){
   button.disabled=true;
   try{
     const status=act==="suspend"?"suspended":"active";
     const r=await sb.from("app_memberships").update({access_status:status}).eq("id",id);
     if(r.error)throw r.error;
     msg(status==="active"?"Member access restored.":"Member access suspended.");
     await load();
   }catch(e){msg(e.message||String(e),true)}
   finally{button.disabled=false}
 }
 document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{view=t.dataset.view;render()});
 document.getElementById("refresh").onclick=load;
 window.addEventListener("focus",load);
 load();
})();
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artist rewards</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;padding:20px;background:#0d0c0c;color:#f4f1ea;font:14px system-ui}button,input,textarea{font:inherit;padding:10px;background:#171616;color:inherit;border:1px solid #444}button{cursor:pointer;margin:4px}button.primary{background:#b91c1c}button:disabled{opacity:.5}article,form{padding:18px;border:1px solid #333;margin:12px 0}label{display:block;margin:12px 0}input:not([type=checkbox]),textarea{box-sizing:border-box;width:100%}textarea{min-height:100px}.muted{color:#aaa}.hidden{display:none}#status{min-height:24px}#catalogue{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}</style></head><body>
<h1>Artist development rewards</h1><p class="muted">Brand experiences earned through progress. Claims need studio approval and scheduling. XP is an eligibility milestone and is not spent.</p><button id="refresh">Refresh</button><button id="new" class="hidden primary">Add reward</button><p id="status" role="status"></p><p id="progress"></p>
<form id="editor" class="hidden"><h2 id="editor-title">Add reward</h2><input id="reward-id" type="hidden"><label>Reward name<input id="title" required maxlength="160"></label><label>Description and scope<textarea id="description" maxlength="3000"></textarea></label><label>Minimum XP milestone<input id="xp" type="number" min="0" step="1" value="0" required></label><label>Total places available<input id="capacity" type="number" min="1" max="10000" step="1" value="1" required></label><label><input id="active" type="checkbox"> Active — artists can request this reward</label><label><input id="archived" type="checkbox"> Archived</label><button class="primary" id="save">Save reward</button><button type="button" id="cancel">Close</button></form>
<h2>Catalogue</h2><div id="catalogue"></div><h2 id="queue-title">My claims</h2><div id="claims"></div>
<script>
(function(){const sb=supabase.createClient('https://xsvczfqvscnvmngwcmtp.supabase.co','sb_publishable_ZQGFWpZzlDsWBRclrySAyg_CYWqvU40',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const el=id=>document.getElementById(id);let generation=0,data=null;
function text(tag,value){const n=document.createElement(tag);n.textContent=value;return n;}
function button(parent,label,action){const b=text('button',label);b.onclick=async()=>{b.disabled=true;try{await action();}catch(e){el('status').textContent=e.message||'Could not complete the action.';}finally{b.disabled=false;}};parent.append(b);}
async function action(operation,payload){const version=generation;const r=await sb.rpc('studio_reward_workspace',{operation,payload});if(version!==generation)return;if(r.error)throw r.error;el('status').textContent='Saved.';await load();}
function edit(r){el('editor').classList.remove('hidden');el('reward-id').value=r?.id||'';el('title').value=r?.title||'';el('description').value=r?.description||'';el('xp').value=r?.minimum_xp??0;el('capacity').value=r?.capacity??1;el('active').checked=r?.active||false;el('archived').checked=r?.archived||false;el('editor-title').textContent=r?'Edit reward':'Add reward';el('editor').scrollIntoView({block:'start'});}
async function load(){const version=++generation;el('status').textContent='Loading rewards…';const r=await sb.rpc('studio_reward_workspace',{operation:'view',payload:{}});if(version!==generation)return;el('catalogue').replaceChildren();el('claims').replaceChildren();el('editor').classList.add('hidden');if(r.error){data=null;el('new').classList.add('hidden');el('progress').textContent='';el('status').textContent='Sign in with active Artist or Owner access to view rewards.';return;}data=r.data;el('new').classList.toggle('hidden',!data.owner);el('queue-title').textContent=data.owner?'Reward claim queue':'My claims';el('progress').textContent=data.owner?'New rewards start inactive. Set the scope, milestone and capacity before activating.':'Your current XP: '+data.xp;
if(!data.rewards.length)el('catalogue').append(text('p','No rewards are available yet.'));
data.rewards.forEach(r=>{const card=document.createElement('article');card.append(text('h3',r.title),text('p',r.description),text('p','Milestone: '+r.minimum_xp+' XP · '+r.places_left+' places left'+(data.owner?' · '+(r.archived?'Archived':r.active?'Active':'Inactive'):'')));if(data.owner)button(card,'Edit reward',()=>edit(r));else{const existing=data.claims.find(c=>c.reward_id===r.id&&c.status!=='denied');if(existing)card.append(text('p','Your claim: '+existing.status));else if(data.xp>=r.minimum_xp&&r.places_left>0)button(card,'Request reward',()=>action('claim',{reward_id:r.id}));else card.append(text('p',r.places_left?'Keep building towards this milestone.':'All places are currently claimed.'));}el('catalogue').append(card);});
if(!data.claims.length)el('claims').append(text('p','No reward claims yet.'));
data.claims.forEach(c=>{const card=document.createElement('article');card.append(text('h3',c.title_snapshot+' · '+c.status),text('p',c.description_snapshot));if(data.owner)card.append(text('p',c.artist_name||'Artist'));if(c.owner_note)card.append(text('p','Studio note: '+c.owner_note));if(data.owner){if(c.status==='requested'){button(card,'Approve claim',()=>action('approve',{claim_id:c.id}));button(card,'Decline claim',()=>{const note=prompt('Reason for declining');if(note!==null)return action('deny',{claim_id:c.id,note});});}if(c.status==='approved')button(card,'Record fulfilment',()=>{const note=prompt('Describe the experience delivered and date.');if(note!==null)return action('fulfil',{claim_id:c.id,note});});}el('claims').append(card);});el('status').textContent='Rewards updated.';}
el('new').onclick=()=>{if(data?.owner)edit(null);};el('cancel').onclick=()=>el('editor').classList.add('hidden');el('refresh').onclick=load;
el('editor').onsubmit=async e=>{e.preventDefault();if(!data?.owner)return;const b=el('save');b.disabled=true;try{await action('save',{id:el('reward-id').value,title:el('title').value.trim(),description:el('description').value.trim(),minimum_xp:Number(el('xp').value),capacity:Number(el('capacity').value),active:el('active').checked&&!el('archived').checked,archived:el('archived').checked});}catch(e){el('status').textContent=e.message;}finally{b.disabled=false;}};
sb.auth.onAuthStateChange(()=>{++generation;data=null;el('editor').classList.add('hidden');el('catalogue').replaceChildren();el('claims').replaceChildren();setTimeout(load,0);});load();})();
</script></body></html>
